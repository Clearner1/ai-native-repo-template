name: Label PR by path
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Read base-repository configuration via API; never check out PR code.
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          sync-labels: false
